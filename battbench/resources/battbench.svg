<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b5797"/>
      <stop offset="1" stop-color="#1b365d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#bg)"/>
  <!-- battery standing upright: terminal, body, charge level -->
  <rect x="78" y="30" width="36" height="16" rx="4" fill="#ffffff"/>
  <rect x="54" y="44" width="84" height="170" rx="14" fill="none" stroke="#ffffff" stroke-width="12"/>
  <rect x="68" y="128" width="56" height="72" rx="5" fill="#6cc04a"/>
  <rect x="68" y="98" width="56" height="24" rx="5" fill="#6cc04a" fill-opacity="0.55"/>
  <!-- magnifying glass over the battery -->
  <line x1="196" y1="196" x2="228" y2="228" stroke="#f28c28" stroke-width="22" stroke-linecap="round"/>
  <circle cx="160" cy="160" r="46" fill="url(#glass)" stroke="#f28c28" stroke-width="14"/>
  <path d="M136 146 a28 28 0 0 1 22 -20" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
</svg>
